<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhâp</title>
</head>
<style>
    body {
        text-align: center;
        justify-content: center;
        align-items: center;
        font-family: inherit;
    }
</style>
<body>
<div>
    <div>
        <h2><b>Đăng nhập</b></h2>
        <h2>DQH - Đặt lịch online sân thể thao</h2>
    </div>
    <div>
        <form th:action="">
            <div>
                <label>Số điện thoại hoặc email</label>
                <div><input type="text" placeholder="Nhập số điện thoại hoặc email"></div>
            </div>
            <div>
                <label>Mật khẩu</label>
                <input type="password" placeholder="Nhập mật khẩu">
            </div>
            <div>
                <button type="submit">ĐĂNG NHẬP</button>
                <a href="#">Quên mật khẩu</a>
                <label>Bạn chưa có tài khoản? <a href="#">Đăng ký ngay</a></label>
            </div>
        </form>
    </div>
</div>

</body>
</html>
